[project]
name = "discord-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andika Dinata", email = "a.introvrt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "langchain>=1.3.15",
    "langgraph>=0.2.73",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain-nvidia-ai-endpoints>=0.3.7",
    "beautifulsoup4>=4.13.3",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.3",
    "aiohttp>=3.14.3",
]

[project.scripts]
discord-chatbot = "discord_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
